<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аудиогид</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="guide-container">
    <!-- Шапка с названием -->
    <header class="header">
      <h1 id="title">Загрузка...</h1>
      <p id="subtitle"></p>
    </header>

    <!-- Изображение картины -->
    <div class="artwork-wrapper">
      <img id="artworkImage" src="" alt="Картина">
    </div>

    <!-- Блок плеера -->
    <div class="player-wrapper">
      <audio id="audioPlayer"></audio>
      
      <button id="playBtn" class="play-btn" aria-label="Play/Pause">
        <!-- SVG иконка Play/Pause -->
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <div class="progress-bar-container">
        <span id="currentTime">00:00</span>
        <input type="range" id="seekSlider" value="0" min="0" step="1">
        <span id="duration">- 00:00</span>
      </div>
    </div>

    <!-- Текстовое описание / транскрипт -->
    <div class="transcript-wrapper">
      <p id="transcriptText"></p>
    </div>
  </div>

  <!-- Подключаем данные и логику -->
  <script src="data.js"></script>
  <script>
    // 1. Получаем ID из URL (например, ?id=1)
    const params = new URLSearchParams(window.location.search);
    const exhibitId = params.get('id') || '1'; // если параметра нет, открываем 1-ю

    const item = exhibitsData[exhibitId];

    if (item) {
      document.getElementById('title').textContent = item.title;
      document.getElementById('subtitle').textContent = item.subtitle;
      document.getElementById('artworkImage').src = item.image;
      document.getElementById('transcriptText').textContent = item.text;

      const audio = document.getElementById('audioPlayer');
      audio.src = item.audio;

      // Логика плеера
      const playBtn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const seekSlider = document.getElementById('seekSlider');
      const currentTimeEl = document.getElementById('currentTime');
      const durationEl = document.getElementById('duration');

      function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        } else {
          audio.pause();
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        seekSlider.max = Math.floor(audio.duration);
        durationEl.textContent = '- ' + formatTime(audio.duration);
      });

      audio.addEventListener('timeupdate', () => {
        seekSlider.value = Math.floor(audio.currentTime);
        currentTimeEl.textContent = formatTime(audio.currentTime);
        const remaining = audio.duration - audio.currentTime;
        durationEl.textContent = '- ' + formatTime(remaining);
      });

      seekSlider.addEventListener('input', () => {
        audio.currentTime = seekSlider.value;
      });

      audio.addEventListener('ended', () => {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        seekSlider.value = 0;
      });
    } else {
      document.querySelector('.guide-container').innerHTML = '<p style="text-align:center; padding: 40px;">Экспонат не найден.</p>';
    }
  </script>
</body>
</html>
